[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-harness"
version = "0.1.0"
description = "LLM poker arena: agents write bots, play matches, read logs, improve."
readme = "README.md"
license = { text = "MIT" }
# eval7 0.1.7 does not build on 3.11+ (longintrepr.h moved)
requires-python = ">=3.10,<3.11"
# eval7 must be installed first with --no-build-isolation; see `make install`
dependencies = ["eval7==0.1.7"]

[project.optional-dependencies]
dev  = ["pytest>=7"]
demo = ["flask>=3.0.0"]

[tool.setuptools.packages.find]
include = ["arena*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# eval7 0.1.7 uses deprecated pyparsing names
filterwarnings = ["ignore::DeprecationWarning:eval7.*"]
