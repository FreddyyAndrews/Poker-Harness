[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-harness"
version = "0.6.1"
description = "Poker bot toolkit: NLHE engine, bot protocol and a local development arena for LLM-built bots."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# eval7 0.1.11 ships wheels only (no source package): Linux x86_64 for
# Python 3.9-3.15, macOS and Windows for 3.9-3.12. See README "Install".
dependencies = ["eval7>=0.1.11,<0.2", "pyyaml>=6", "pydantic>=2.5,<3", "httpx>=0.27,<1"]

[project.scripts]
arena = "poker_harness.cli.main:main"

[project.optional-dependencies]
dev  = ["pytest>=7", "fastapi>=0.110", "uvicorn>=0.29"]
mock = ["fastapi>=0.110", "uvicorn>=0.29"]
demo = ["flask>=3.0.0"]

[tool.setuptools.packages.find]
include = ["poker_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# eval7 uses deprecated pyparsing names
filterwarnings = ["ignore::DeprecationWarning:eval7.*"]
